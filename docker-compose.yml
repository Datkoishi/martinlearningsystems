name: martin-learning-systems

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --batch --skip-column-names --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app_network

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      ENABLE_IMPORT_API: "false"
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      MIGRATIONS_PATH: /app/database/init
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-30}
      MIGRATION_ACTOR: ${MIGRATION_ACTOR:-compose-migrator}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      ENABLE_IMPORT_API: ${ENABLE_IMPORT_API:-false}
      IMPORT_STORAGE_PATH: /app/.data/imports
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      MIGRATIONS_PATH: /app/database/init
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-30}
      MIGRATION_ACTOR: ${MIGRATION_ACTOR:-compose-operator}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - import_data:/app/.data/imports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  backup:
    build:
      context: ./ops/backup
      dockerfile: Dockerfile
    profiles: ["backup"]
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: ["/ops/backup/backup-loop.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      IMPORT_STORAGE_PATH: /source/imports
      BACKUP_ROOT: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-90000}
      BACKUP_STALE_LOCK_SECONDS: ${BACKUP_STALE_LOCK_SECONDS:-21600}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
    volumes:
      - import_data:/source/imports:ro
      - backup_data:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ops/backup/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: ${BACKUP_HEALTH_START_PERIOD:-10m}
    networks:
      - app_network

volumes:
  mysql_data:
  import_data:
  backup_data:

networks:
  app_network:
    driver: bridge
