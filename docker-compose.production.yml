name: martin-learning-systems-production

services:
  mysql:
    environment:
      MYSQL_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD: !reset null
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    ports: !reset []
    secrets:
      - mysql_password
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/mysql_password) mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --batch --skip-column-names --execute='SELECT 1' >/dev/null"]
    security_opt:
      - no-new-privileges:true

  migrate:
    environment:
      NODE_ENV: production
      MYSQL_PASSWORD: !reset null
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
    secrets:
      - mysql_password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  backend:
    environment:
      NODE_ENV: production
      MYSQL_PASSWORD: !reset null
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      METRICS_ENABLED: "true"
      METRICS_PORT: "9464"
      METRICS_BIND_ADDRESS: 0.0.0.0
      METRICS_BEARER_TOKEN: !reset null
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
    ports: !reset []
    expose:
      - "3000"
      - "9464"
    secrets:
      - mysql_password
      - metrics_bearer_token
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network
      - egress_network

  frontend:
    ports: !override
      - "${PRODUCTION_HTTP_PORT:-80}:80"
      - "${PRODUCTION_HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/production/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "-", "https://127.0.0.1/healthz"]
    networks:
      - app_network
      - edge_network

  backup:
    environment:
      MYSQL_PASSWORD: !reset null
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_password

  backup-metrics:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/backups/metrics
    volumes:
      - backup_data:/backups:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_bearer_token
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      backup-metrics:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      - app_network

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alert_webhook_url
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - app_network
      - egress_network

secrets:
  mysql_password:
    file: ${MYSQL_PASSWORD_SECRET_FILE:?Set MYSQL_PASSWORD_SECRET_FILE}
  mysql_root_password:
    file: ${MYSQL_ROOT_PASSWORD_SECRET_FILE:?Set MYSQL_ROOT_PASSWORD_SECRET_FILE}
  tls_certificate:
    file: ${TLS_CERTIFICATE_SECRET_FILE:?Set TLS_CERTIFICATE_SECRET_FILE}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_SECRET_FILE:?Set TLS_PRIVATE_KEY_SECRET_FILE}
  metrics_bearer_token:
    file: ${METRICS_BEARER_TOKEN_SECRET_FILE:?Set METRICS_BEARER_TOKEN_SECRET_FILE}
  alert_webhook_url:
    file: ${ALERT_WEBHOOK_URL_SECRET_FILE:?Set ALERT_WEBHOOK_URL_SECRET_FILE}

volumes:
  prometheus_data:
  alertmanager_data:

networks:
  app_network:
    internal: true
  egress_network:
    driver: bridge
  edge_network:
    driver: bridge
