<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ khu vườn hình chữ nhật</title>
  <desc id="desc">Hình chữ nhật ABCD có chiều dài 12 mét và chiều rộng 8 mét</desc>
  <rect width="720" height="360" rx="24" fill="#fffdf8"/>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#dcebe2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="150" y="70" width="420" height="220" fill="url(#grid)" stroke="#174f3f" stroke-width="5"/>
  <path d="M160 80h20v20" fill="none" stroke="#d99b3e" stroke-width="5"/>
  <circle cx="150" cy="70" r="6" fill="#174f3f"/><circle cx="570" cy="70" r="6" fill="#174f3f"/>
  <circle cx="570" cy="290" r="6" fill="#174f3f"/><circle cx="150" cy="290" r="6" fill="#174f3f"/>
  <g fill="#18231f" font-family="Arial, sans-serif" font-size="24" font-weight="700">
    <text x="120" y="55">A</text><text x="580" y="55">B</text><text x="580" y="325">C</text><text x="120" y="325">D</text>
  </g>
  <g fill="#174f3f" font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <text x="335" y="48">12 m</text><text x="585" y="190">8 m</text>
  </g>
</svg>
